<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockChompers</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none; /* overlay children that need clicks opt back in */
        font: 16px/1.4 system-ui, sans-serif;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-game"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
