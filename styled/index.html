<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockChompers</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
        touch-action: none; /* taps go straight to pointerdown: no pan, zoom or double-tap delay */
      }
      /* Win confetti: its own transparent canvas above the UI (Config.render.vfx.confetti). */
      #canvas-fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }
      /* Layout only. Colours and sizes are CSS custom properties published from Config.ui by UIManager; animations are
         Web Animations on transform and opacity, driven by Config.ui.anim. */
      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none; /* only buttons and modals take clicks */
        font-family: system-ui, sans-serif;
        font-size: var(--ui-size-font);
        color: var(--ui-color-text);
        user-select: none;
      }
      #ui-root [hidden] {
        display: none !important;
      }
      #ui-root button {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
        pointer-events: auto;
      }
      #ui-root button:disabled {
        cursor: default;
        opacity: var(--ui-disabled-opacity);
      }
      #ui-root .bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--ui-size-bar-height);
        padding: 0 var(--ui-size-bar-padding);
        background: var(--ui-color-bar);
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      #ui-root .icon-button {
        justify-self: start;
        width: var(--ui-size-icon-button);
        height: var(--ui-size-icon-button);
        border-radius: var(--ui-size-radius);
        background: var(--ui-color-panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--ui-size-icon-bar-gap);
      }
      #ui-root .icon-bar {
        width: var(--ui-size-icon-bar-width);
        height: var(--ui-size-icon-bar-height);
        background: var(--ui-color-text);
      }
      #ui-root .bar-level {
        font-weight: 600;
      }
      #ui-root .bar-money {
        justify-self: end;
        font-weight: 600;
        color: var(--ui-color-money);
        font-variant-numeric: tabular-nums;
      }
      #ui-root .modal {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ui-color-backdrop);
        pointer-events: auto; /* blocks input to the game underneath */
      }
      #ui-root .card {
        width: var(--ui-size-card-width);
        max-width: calc(100% - 2 * var(--ui-size-card-padding));
        padding: var(--ui-size-card-padding);
        box-sizing: border-box;
        border-radius: var(--ui-size-radius);
        background: var(--ui-color-panel);
        display: flex;
        flex-direction: column;
        gap: var(--ui-size-gap);
        text-align: center;
      }
      #ui-root .card-title {
        margin: 0;
        font-size: var(--ui-size-title-font);
      }
      #ui-root .card-reward,
      #ui-root .fly-label {
        font-size: var(--ui-size-title-font);
        font-weight: 700;
        color: var(--ui-color-money);
        font-variant-numeric: tabular-nums;
      }
      #ui-root .fly-label {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 7; /* over the overlays and the raised HUD piece */
        pointer-events: none;
        white-space: nowrap;
      }
      #ui-root .card,
      #ui-root .fly-label {
        will-change: transform, opacity;
      }
      #ui-root .modal[data-result='won'] .card-title { color: var(--ui-color-won); }
      #ui-root .modal[data-result='lost'] .card-title { color: var(--ui-color-lost); }
      #ui-root .button {
        padding: var(--ui-size-button-pad-y) var(--ui-size-button-pad-x);
        border-radius: var(--ui-size-radius);
        background: var(--ui-color-button);
        color: var(--ui-color-button-text);
        font-weight: 600;
      }
      #ui-root .button-secondary {
        background: var(--ui-color-button-secondary);
        color: var(--ui-color-button-secondary-text);
      }
      /* Start screen: the same modal and card, darker backdrop, big title and Play button. */
      #ui-root .modal-start {
        background: var(--ui-color-title-backdrop);
      }
      #ui-root .modal-start .card {
        width: var(--ui-size-start-card-width);
      }
      #ui-root .modal-start .card-title {
        font-size: var(--ui-size-start-title-font);
        color: var(--ui-color-title);
      }
      #ui-root .button-play {
        padding: var(--ui-size-play-pad-y) var(--ui-size-button-pad-x);
        font-size: var(--ui-size-play-font);
      }
      /* Styled start screen (Config.ui.startScreen, --ui-start-*): the key art contained in the viewport over a blurred,
         darkened copy of itself. UIManager places the art and the Play button (layout/computeStartScreenLayout.js) and
         sets the image URLs and the label size inline. */
      #ui-root .start-styled {
        background: var(--ui-start-backdrop-color);
        overflow: hidden;
      }
      #ui-root .start-backdrop {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        filter: var(--ui-start-backdrop-filter);
        transform: scale(var(--ui-start-backdrop-scale)); /* hides the blur's soft edge */
      }
      #ui-root .start-art,
      #ui-root .start-play-anchor {
        position: absolute;
      }
      #ui-root .start-art {
        will-change: transform, opacity;
      }
      #ui-root .start-art-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      #ui-root .start-play-pulse,
      #ui-root .start-play {
        width: 100%;
        height: 100%;
      }
      /* The green pill (Config PILL_BUTTON): the start screen's Play and every styled overlay button share these rules.
         The image and the label size (a fraction of the button height) are set inline. */
      #ui-root .start-play,
      #ui-root .ov-button {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 9999px;
        background: transparent center / 100% 100% no-repeat;
        font-family: var(--ui-start-font);
        line-height: 1;
        color: var(--ui-start-label-color);
        -webkit-text-stroke: var(--ui-start-outline);
        paint-order: stroke fill; /* the outline sits behind the letters, so they keep their full weight */
        text-shadow: var(--ui-start-shadow);
        filter: var(--ui-start-button-shadow); /* the pill's shadow on the art (the baked one was removed) */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #ui-root .start-play-label,
      #ui-root .ov-button-label {
        white-space: nowrap;
        transform: translateY(var(--ui-start-label-offset));
      }
      #ui-root .start-play:focus,
      #ui-root .ov-button:focus {
        outline: none;
      }
      #ui-root .start-play:focus-visible,
      #ui-root .ov-button:focus-visible {
        outline: var(--ui-start-focus);
        outline-offset: var(--ui-start-focus-offset);
      }
      @media (hover: hover) {
        #ui-root .start-play:hover,
        #ui-root .ov-button:enabled:hover {
          filter: var(--ui-start-button-shadow) var(--ui-start-hover);
        }
      }
      /* Styled HUD (Config.ui.hud, --ui-hud-*): UIManager sizes and places every piece from the Renderer's
         screenFrame() (inline px); the bars are static containers around their text. */
      #ui-root .bar.hud-styled {
        display: block;
        padding: 0;
        background: none;
      }
      #ui-root .hud-styled > * {
        position: absolute;
        filter: var(--ui-hud-drop);
      }
      #ui-root .hud-settings {
        padding: 0;
        border-radius: 50%;
        background: transparent center / 100% 100% no-repeat;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #ui-root .hud-settings:focus {
        outline: none;
      }
      #ui-root .hud-settings:focus-visible {
        outline: var(--ui-hud-focus);
        outline-offset: var(--ui-hud-focus-offset);
      }
      #ui-root .hud-bar {
        background: center / 100% 100% no-repeat;
      }
      #ui-root .hud-text-box {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #ui-root .hud-text {
        position: relative;
        top: var(--ui-hud-offset); /* centres the capitals on the bar */
        display: inline-block;
        white-space: nowrap;
        font-family: var(--ui-start-font);
        line-height: 1;
        color: var(--ui-hud-text-color);
        -webkit-text-stroke: var(--ui-hud-outline);
        paint-order: stroke fill;
        text-shadow: var(--ui-hud-shadow);
        font-variant-numeric: tabular-nums;
      }
      #ui-root .hud-coin-icon {
        position: absolute;
        pointer-events: none;
      }
      /* The HUD piece kept above an overlay's dim (the bar itself is no stacking context): the coins over a result, the
         settings button over the pause panel, with a static ring. */
      #ui-root .hud-styled > .is-raised {
        z-index: 6;
      }
      #ui-root .hud-settings.is-raised {
        box-shadow: var(--ui-hud-raised-ring);
      }
      /* Overlay buttons are disabled only while their overlay enters or leaves: no dimming then. */
      #ui-root .ov-root button:disabled,
      #ui-root .modal button:disabled {
        opacity: 1;
      }
      /* Styled overlays (Config.ui.overlays, --ui-ov-*): a dim over the game and the HUD (it takes every tap under it
         and does nothing), and a glass panel from a gradient, a border and inset shadows, with no backdrop-filter.
         UIManager places the panel and what is on it from the Renderer's screenFrame() (layout/computeOverlayLayout.js);
         --ov-s is CSS px per artboard px, so the lengths below are artboard px x --ov-s. */
      #ui-root .ov-root {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: var(--ui-ov-backdrop);
        pointer-events: auto;
      }
      #ui-root .ov-panel {
        position: absolute;
        box-sizing: border-box;
        border: calc(var(--ov-s) * var(--ui-ov-rim-width) * 1px) solid var(--ui-ov-rim-light);
        border-radius: calc(var(--ov-s) * var(--ui-ov-radius) * 1px);
        background: var(--ui-ov-fill);
        box-shadow:
          inset 0 0 0 calc(var(--ov-s) * var(--ui-ov-rim-width) * 1px) var(--ui-ov-rim-dark),
          inset 0 0 calc(var(--ov-s) * var(--ui-ov-glow-blur) * 1px) calc(var(--ov-s) * (var(--ui-ov-rim-width) + var(--ui-ov-glow-width)) * 1px) var(--ui-ov-glow);
        will-change: transform, opacity;
      }
      /* Everything on the panel is placed from its outer top-left corner: this box spans the border too. */
      #ui-root .ov-content {
        position: absolute;
        inset: calc(var(--ov-s) * var(--ui-ov-rim-width) * -1px);
      }
      #ui-root .ov-content::before {
        content: '';
        position: absolute;
        left: calc(var(--ov-s) * var(--ui-ov-glint-x) * 1px);
        top: calc(var(--ov-s) * var(--ui-ov-glint-y) * 1px);
        width: calc(var(--ov-s) * var(--ui-ov-glint-width) * 1px);
        height: calc(var(--ov-s) * var(--ui-ov-glint-height) * 1px);
        border-radius: 9999px;
        background: var(--ui-ov-glint-color);
      }
      #ui-root .ov-font,
      #ui-root .ov-text {
        font-family: var(--ui-start-font);
        font-weight: normal;
        line-height: 1;
        white-space: nowrap;
      }
      #ui-root .ov-text {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        will-change: transform, opacity;
      }
      /* Title: its outline and shadow on their own layer, under the gradient letters (the stroke half inside the
         letters is hidden, so they keep their full weight). */
      #ui-root .ov-title-outline {
        color: var(--ui-ov-title-outline-color);
        -webkit-text-stroke: var(--ui-ov-title-outline);
        text-shadow: var(--ui-ov-title-shadow);
      }
      #ui-root .ov-title-fill {
        position: absolute;
        inset: 0;
        background: var(--ui-ov-title-fill);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #ui-root .ov-subtitle {
        color: var(--ui-ov-subtitle-color);
        -webkit-text-stroke: var(--ui-ov-subtitle-outline);
        paint-order: stroke fill;
        text-shadow: var(--ui-ov-subtitle-shadow);
      }
      #ui-root .ov-reward {
        color: var(--ui-ov-reward-color);
        -webkit-text-stroke: var(--ui-ov-reward-outline);
        paint-order: stroke fill;
        text-shadow: var(--ui-ov-reward-shadow);
        font-variant-numeric: tabular-nums;
      }
      #ui-root .ov-button {
        position: absolute;
        text-transform: uppercase;
        will-change: transform, opacity;
      }
      /* Art: a placed box (entrance) > an idle-loop layer (bob, float) > the images and CSS bubbles, in % of the box. */
      #ui-root .ov-art,
      #ui-root .ov-idle,
      #ui-root .ov-art img,
      #ui-root .ov-bubble,
      #ui-root .ov-arc,
      #ui-root .ov-small {
        position: absolute;
      }
      #ui-root .ov-art {
        will-change: transform, opacity;
      }
      #ui-root .ov-idle,
      #ui-root .ov-bubble {
        inset: 0;
      }
      #ui-root .ov-coin {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #ui-root .ov-art img {
        display: block;
        pointer-events: none;
      }
      #ui-root .ov-bubble,
      #ui-root .ov-arc,
      #ui-root .ov-small {
        border-radius: 50%;
      }
      #ui-root .ov-bubble {
        box-shadow: 0 0 calc(var(--ov-s) * var(--ui-ov-bubble-glow-blur) * 1px) var(--ui-ov-bubble-glow);
      }
      #ui-root .ov-arc {
        border-style: solid;
        border-color: transparent;
      }
      /* Gameplay background art (Config.render.backgroundArt), beneath the transparent game canvas: a blurred cover
         copy and the art contained in the design frame (GameBackground places it). */
      #game-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      #game-bg[hidden] {
        display: none;
      }
      #game-bg .game-bg-blur {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
      }
      #game-bg .game-bg-art {
        position: absolute;
        display: block;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-D-uoifx3.js"></script>
  </head>
  <body>
    <div id="game-bg" hidden></div>
    <canvas id="canvas-game"></canvas>
    <div id="ui-root"></div>
    <canvas id="canvas-fx"></canvas>
  </body>
</html>
